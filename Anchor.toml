[toolchain]
anchor_version = "0.31.1"
solana_version = "2.1.0"
package_manager = "yarn"

[features]
# anchor-syn 0.31.1 mis-parses `mint.key().as_ref()` seeds with the current
# macro stack; clients pass PDAs explicitly, so auto-resolution is off.
resolution = false
skip-lint = false

[programs.localnet]
kryon_perps = "2vgBHV763RtsBZGNpnuvbkGDKJdtt1DxP9tUDo4NZxUB"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
