# Host-only program tests (LiteSVM). A separate workspace on purpose: its
# dependencies must never move the program's lockfile off versions that
# platform-tools v1.43 (rustc 1.79) can build.
[workspace]

[package]
name = "floydex-integration"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anchor-lang = "=0.31.1"
anchor-spl = { version = "=0.31.1", default-features = false, features = ["token", "token_2022", "associated_token"] }
bincode = "1"
bytemuck = "1"
floydex-perps = { path = "../programs/floydex-perps", features = ["no-entrypoint", "bench"] }
litesvm = "0.7.1"
protocol-core = { path = "../crates/protocol-core" }
pyth-solana-receiver-sdk = "=1.0.1"
risk-engine = { path = "../crates/risk-engine" }
solana-account = "2.2"
solana-keypair = "2.2"
solana-message = "2.2"
solana-signer = "2.2"
solana-transaction = "2.2"

# `TxResult` is LiteSVM's own (large) error type; boxing it buys nothing in tests.
[lints.clippy]
result_large_err = "allow"
