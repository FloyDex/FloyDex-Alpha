# Local Postgres for the off-chain stack. Not for production — see the
# services-vm memory / ops docs for the real box. Run:
#   docker compose up -d
#   DATABASE_URL=postgresql://floydex:floydex@localhost:5433/floydex \
#   DIRECT_URL=postgresql://floydex:floydex@localhost:5433/floydex \
#   yarn db:migrate:dev
#
# DIRECT_URL is schema.prisma's non-pooled connection for migrations; there's
# no pooler in front of this Postgres, so it's the same URL as DATABASE_URL.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: floydex
      POSTGRES_PASSWORD: floydex
      POSTGRES_DB: floydex
    ports:
      # Non-default host port so this never collides with a Postgres already
      # running on the machine (e.g. for another FloyDex repo).
      - "5433:5432"
    volumes:
      - floydex-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floydex"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  floydex-postgres:
