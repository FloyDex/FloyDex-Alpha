# Every PR and push to main: crates, the SBF program, LiteSVM program tests,
# the TS SDK, and the local-validator end-to-end gate (11 L1: the e2e runs in
# CI, so "a function that doesn't exist on-chain" can never ship again).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.96.1"
  SOLANA_VERSION: "2.1.0"
  ANCHOR_VERSION: "0.31.1"
  NODE_VERSION: "22.18.0"

jobs:
  crates:
    name: cargo test + clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            integration -> target
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path integration/Cargo.toml --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --manifest-path integration/Cargo.toml --all-targets -- -D warnings
      - run: cargo test

  program:
    name: build + program tests + sdk + e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            integration -> target
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Cache Solana CLI and platform-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: solana-${{ runner.os }}-${{ env.SOLANA_VERSION }}
      - name: Install Solana CLI (Agave)
        run: |
          if [ ! -x "$HOME/.local/share/solana/install/active_release/bin/solana" ]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install anchor-cli
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/anchor" \
            "https://github.com/solana-foundation/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu"
          chmod +x "$HOME/.local/bin/anchor"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: solana --version && anchor --version

      - run: yarn install --frozen-lockfile
      - name: yarn build
        run: yarn build
      - name: yarn build:bench
        run: yarn build:bench
      - run: yarn test:program
      - run: yarn test:sdk
      - name: yarn e2e 200
        run: yarn e2e 200
      - name: e2e logs
        if: failure()
        run: tail -n 200 .e2e/validator.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: .e2e/report.json
          if-no-files-found: ignore
